<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar equipo</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module" src="modify.js"></script>
</head>
<body onload="loadTeam()">
    <div class="container">
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link" href="index.html">Equipos</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="register.html">Nuevo equipo</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="players.html">Jugadores</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="player-register.html">Nuevo jugador</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="#">Modificar equipo</a>
            </li>
        </ul>

        <h1 class="mt-3">Modificar equipo</h1>

        <form>
            <div class="mb-3">
                <label for="name" class="form-label">Nombre del equipo</label>
                <input type="text" class="form-control" id="name">
            </div>

            <div class="mb-3">
                <label for="city" class="form-label">Ciudad del equipo</label>
                <input type="text" class="form-control" id="city">
            </div>

            <div class="mb-3">
                <label for="sport" class="form-label">Deporte del equipo</label>
                <input type="text" class="form-control" id="sport">
            </div>

            <div class="mb-3">
                <label for="image_url" class="form-label">URL de la imagen</label>
                <input type="text" class="form-control" id="image_url" placeholder="https://ejemplo.com/imagen.png">
            </div>

            <button type="button" class="btn btn-primary" onClick="updateTeam()">Modificar equipo</button>
        </form>
    </div>
</body>
</html>
