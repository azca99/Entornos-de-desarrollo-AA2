<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar equipo</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="register.js"></script>
</head>
<body>
    <div class="container">
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link" href="index.html">Equipos</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="register.html">Nuevo equipo</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="players.html">Jugadores</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="player-register.html">Nuevo jugador</a>
            </li>
        </ul>

        <div class="page-header">
            <h1 class="page-title">Registro de equipos</h1>
            <p class="page-subtitle">Añade un nuevo equipo a la aplicación</p>
        </div>

        <div class="card content-card">
            <div class="card-body">
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Nombre del equipo</label>
                        <input type="text" class="form-control" id="name">
                    </div>

                    <div class="mb-3">
                        <label for="city" class="form-label">Ciudad del equipo</label>
                        <input type="text" class="form-control" id="city">
                    </div>

                    <div class="mb-3">
                        <label for="sport" class="form-label">Deporte del equipo</label>
                        <input type="text" class="form-control" id="sport">
                    </div>

                    <div class="mb-4">
                        <label for="image_url" class="form-label">URL de la imagen</label>
                        <input type="text" class="form-control" id="image_url" placeholder="https://ejemplo.com/imagen.png">
                    </div>

                    <button type="button" class="btn btn-primary" onclick="addTeam()">Registrar equipo</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
