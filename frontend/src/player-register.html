<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar jugador</title>
    <link rel="icon" type="image/x-icon" href="../img/favicon.ico">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="player-register.js"></script>
</head>
<body onload="loadTeams()">
    <div class="container">
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link" href="index.html">Equipos</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="register.html">Nuevo equipo</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="players.html">Jugadores</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="player-register.html">Nuevo jugador</a>
            </li>
        </ul>

        <div class="page-header">
            <h1 class="page-title">Registro de jugadores</h1>
            <p class="page-subtitle">Añade un nuevo jugador a la aplicación</p>
        </div>

        <div class="card content-card">
            <div class="card-body">
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Nombre del jugador</label>
                        <input type="text" class="form-control" id="name">
                    </div>

                    <div class="mb-3">
                        <label for="birth_date" class="form-label">Fecha de nacimiento</label>
                        <input type="date" class="form-control" id="birth_date">
                    </div>

                    <div class="mb-3">
                        <label for="position" class="form-label">Posición</label>
                        <input type="text" class="form-control" id="position">
                    </div>

                    <div class="mb-3">
                        <label for="id_team" class="form-label">Equipo</label>
                        <select class="form-select" id="id_team">
                            <option value="">Seleccione un equipo</option>
                        </select>
                    </div>

                    <button type="button" class="btn btn-primary" onClick="addPlayer()">Registrar jugador</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
