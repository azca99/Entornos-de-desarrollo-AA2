<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLAZO</title>
    <link rel="icon" type="image/x-icon" href="../img/favicon.ico">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="index.js"></script>
</head>
<body onload="readTeams()">
    <div class="container">

        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link active" href="index.html">Equipos</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="register.html">Nuevo equipo</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="players.html">Jugadores</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="player-register.html">Nuevo jugador</a>
            </li>
        </ul>

        <div class ="page-header">
            <h1 class="page-title">Listado de equipos</h1>
            <p class="page-subtitle">Consulta, edita y elimina equipos deportivos</p>
        </div>    

        <div class="card content-card">
            <div class="card-body">
                <div class="search-box">
                    <label for="searchTeam" class="form-label">Buscar equipo</label>
                    <input type="text" class="form-control" id="searchTeam" placeholder="Escribe nombre, ciudad o deporte" onkeyup="filterTeams()">
                </div>

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Ciudad</th>
                                <th>Deporte</th>
                                <th>Escudo</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
